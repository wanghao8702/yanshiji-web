<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>燕食记 · 书中美食</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECE0;--paper-2:#EDE3D4;--ink:#3A2E26;--ink-soft:#6B5B4F;
    --line-soft:#D8C9B4;--gold:#B8893E;--rust:#C15F3C;--green:#6B7A56;--crimson:#7A2A1A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Serif SC",serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.7;}

  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:14px 32px;background:rgba(244,236,224,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);}
  .nav .brand{font-family:"ZCOOL XiaoWei",serif;font-size:22px;letter-spacing:.12em;}
  .nav .brand small{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-soft);letter-spacing:.18em;margin-left:10px;text-transform:uppercase;}
  .nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0;}
  .nav a{text-decoration:none;color:var(--ink-soft);padding:6px 16px;border-radius:20px;font-size:15px;transition:.2s;}
  .nav a:hover{color:var(--ink);background:var(--paper-2);}
  .nav a.active{color:#fff;background:var(--rust);}

  header.hd{text-align:center;padding:38px 20px 6px;}
  header.hd h1{font-family:"ZCOOL XiaoWei",serif;font-size:clamp(28px,4vw,44px);letter-spacing:.1em;margin:0 0 10px;font-weight:400;}
  header.hd p{margin:0 auto;max-width:660px;color:var(--ink-soft);font-size:15px;}

  .tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:960px;margin:24px auto 8px;padding:0 20px;}
  .tab{font-family:"ZCOOL XiaoWei",serif;font-size:15px;letter-spacing:.08em;padding:7px 20px;border-radius:22px;
    border:1px solid var(--line-soft);background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:.2s;}
  .tab .ct{font-family:"JetBrains Mono",monospace;font-size:11px;margin-left:6px;opacity:.7;}
  .tab:hover{border-color:var(--gold);color:var(--ink);}
  .tab.active{background:var(--rust);color:#fff;border-color:var(--rust);}

  .grid{max-width:1140px;margin:22px auto 50px;padding:0 24px;
    display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .dish{background:var(--paper);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;
    cursor:pointer;transition:.25s;box-shadow:0 8px 26px -20px rgba(58,46,38,.6);position:relative;}
  .dish:hover{transform:translateY(-4px);box-shadow:0 16px 36px -18px rgba(58,46,38,.55);border-color:var(--gold);}
  .dish .illus{background:linear-gradient(160deg,#F7F0E4,#EFE4D2);border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:center;padding:8px 14px;}
  .dish .illus svg{width:100%;height:auto;max-height:160px;}
  .dish .meta{padding:14px 18px 18px;}
  .dish .cat{font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;}
  .dish .dn{font-family:"ZCOOL XiaoWei",serif;font-size:20px;margin:4px 0 8px;letter-spacing:.05em;}
  .dish .q{font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .dish .q::before{content:"“";color:var(--rust);}
  .dish .q::after{content:"”";color:var(--rust);}

  .overlay{position:fixed;inset:0;z-index:100;background:rgba(40,30,22,.5);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:24px;}
  .overlay.show{display:flex;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .card{width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--paper);border-radius:18px;
    border:1px solid var(--line-soft);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:rise .3s cubic-bezier(.2,.8,.2,1);}
  @keyframes rise{from{transform:translateY(18px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .card .chero{background:linear-gradient(160deg,#F7F0E4,#EBDFCC);padding:18px;text-align:center;position:relative;border-bottom:1px solid var(--line-soft);}
  .card .chero svg{width:220px;height:auto;}
  .card .close{position:absolute;top:14px;right:16px;width:34px;height:34px;border:none;border-radius:50%;
    background:var(--paper);color:var(--ink);font-size:20px;cursor:pointer;line-height:1;transition:.2s;}
  .card .close:hover{background:var(--rust);color:#fff;}
  .card .cbody{padding:22px 28px 30px;}
  .card .ccat{font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;}
  .card .ctitle{font-family:"ZCOOL XiaoWei",serif;font-size:30px;margin:4px 0 14px;letter-spacing:.06em;}
  .card .quote{font-size:16px;color:var(--rust);border-left:3px solid var(--gold);padding-left:14px;margin:0 0 18px;font-style:italic;}
  .card .sect{margin-top:18px;}
  .card .sh{font-family:"ZCOOL XiaoWei",serif;font-size:15px;color:var(--gold);letter-spacing:.1em;margin:0 0 8px;}
  .card .sect p{margin:0;font-size:14.5px;}
  .card .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .card .tags span{font-size:12.5px;padding:4px 12px;border-radius:14px;background:var(--paper-2);border:1px solid var(--line-soft);color:var(--ink-soft);}

  footer.src{max-width:880px;margin:0 auto;padding:0 24px 60px;font-size:12.5px;color:var(--ink-soft);line-height:1.9;text-align:center;}
  footer.src h4{font-family:"ZCOOL XiaoWei",serif;color:var(--gold);font-size:14px;margin:0 0 6px;letter-spacing:.1em;}
  .count{text-align:center;font-size:12.5px;color:var(--ink-soft);font-family:"JetBrains Mono",monospace;margin:4px 0 0;}

  @media (max-width:820px){.nav{padding:12px 16px;}}
  /* ── 背景音乐播放器 ── */
  .player{position:fixed;bottom:22px;right:22px;z-index:60;display:flex;align-items:center;gap:11px;
    padding:9px 15px 9px 9px;background:rgba(244,236,224,.92);backdrop-filter:blur(10px);
    border:1px solid var(--line-soft);border-radius:44px;box-shadow:0 14px 32px -16px rgba(58,46,38,.55);
    transition:box-shadow .3s ease;}
  .player:hover{box-shadow:0 18px 38px -16px rgba(58,46,38,.6);}
  .player .disc{width:46px;height:46px;flex:none;animation:spin 7s linear infinite;animation-play-state:paused;}
  .player.playing .disc{animation-play-state:running;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .player .pinfo{min-width:80px;max-width:128px;}
  .player .ptitle{font-family:"ZCOOL XiaoWei",serif;font-size:15px;line-height:1.2;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player .psub{font-size:11px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player .pctrl{display:flex;gap:7px;}
  .player .pbtn{width:34px;height:34px;flex:none;padding:0;border-radius:50%;cursor:pointer;
    border:1px solid var(--line-soft);background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:.2s;}
  .player .pbtn:hover{background:var(--rust);color:#fff;border-color:var(--rust);}
  .player .pbtn svg{width:15px;height:15px;display:block;fill:currentColor;}
  @media (max-width:760px){
    .player{bottom:14px;right:14px;gap:9px;padding:8px 12px 8px 8px;}
    .player .pinfo{display:none;}
    .player .disc{width:40px;height:40px;}
  }
  @media (prefers-reduced-motion:reduce){ .player .disc{animation:none!important;} }
</style>
</head>

<header class="hd">
  <h1>书中美食</h1>
  <p>《燕食记》里近四十道粤菜、点心、素斋与本帮苏浙味。沿着茶点、蛇宴、素宴、粤味、本帮五条线索,把书中的滋味一一打开。</p>
</header>

<!-- 岭南纹样 + 古籍插图风共用渐变(全文档唯一,供所有插画引用) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF4E6"/><stop offset="1" stop-color="#F2E4CB"/></linearGradient>
  <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0C97B"/><stop offset="1" stop-color="#C8922F"/></linearGradient>
  <linearGradient id="brothG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E6CC"/><stop offset="1" stop-color="#E3CB9C"/></linearGradient>
  <linearGradient id="jadeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CFE0B8"/><stop offset="1" stop-color="#9DB87E"/></linearGradient>
  <linearGradient id="meatG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9663B"/><stop offset="1" stop-color="#6E3A1E"/></linearGradient>
  <linearGradient id="fishG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF0F1"/><stop offset="1" stop-color="#BCCFD1"/></linearGradient>

  <linearGradient id="riceG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF6EC"/><stop offset="1" stop-color="#ECE2CE"/></linearGradient>

</defs></svg>

<div class="tabs" id="tabs">
  <button class="tab active" data-cat="all">全部</button>
  <button class="tab" data-cat="茶点">茶点<span class="ct">6</span></button>
  <button class="tab" data-cat="蛇宴">蛇宴<span class="ct">6</span></button>

  <button class="tab" data-cat="其他">其他粤味<span class="ct">7</span></button>

<div class="grid" id="grid"></div>

<footer class="src">
  <h4>关于引文</h4>
  美食页所引《燕食记》原文严格控制单次引用长度,卡片引语与详情多为意译、概括,保留必要的菜名与文化典故。素宴诸味多为「以素仿荤」的斋菜,菜名虽带荤字,实为豆制与菌蔬所制。
</footer>

<div class="overlay" id="overlay"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
/* ============ 古籍插图风 · SVG 构件库 ============ */
const SV = inner => `<svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
const ST = (x=98,y=58)=>`<g stroke="#B8893E" stroke-width="1.3" fill="none" opacity=".4" stroke-linecap="round"><path d="M${x} ${y} q-6 -11 2 -20 q7 -9 1 -18"/><path d="M${x+26} ${y-4} q6 -11 -2 -20 q-6 -9 0 -18"/></g>`;
// 盘:rim + 内盘
const PLATE = (fill="#F7F0E4")=>`<ellipse cx="120" cy="152" rx="88" ry="22" fill="#F0E5D0" stroke="#8A7058" stroke-width="2.2"/><ellipse cx="120" cy="148" rx="70" ry="16" fill="${fill}" stroke="#C9B79A" stroke-width="1.4"/>`;
// 碗:body + 汤面
const BOWL = (fill="url(#brothG)")=>`<path d="M50 126 q70 30 140 0 q-8 36 -70 40 q-62 -4 -70 -40Z" fill="#EFE4D0" stroke="#8A7058" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="120" cy="126" rx="70" ry="16" fill="${fill}" stroke="#8A7058" stroke-width="2.2"/>`;
// 单字落款印章(右下角)
const SEAL = ch=>`<g transform="translate(196,158)"><rect x="-13" y="-13" width="26" height="26" rx="3" fill="none" stroke="#C15F3C" stroke-width="1.6" opacity=".7"/><text x="0" y="6" font-family="ZCOOL XiaoWei,serif" font-size="16" fill="#C15F3C" opacity=".75" text-anchor="middle">${ch}</text></g>`;
const dot=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;

/* ============ 40 道菜数据 ============ */
const DISHES = [
/* ───────── 一 · 茶点(6) ───────── */
{cat:"茶点",name:"虾饺",seal:"虾",quote:"一只虾饺,十三道褶",
 svg:SV(`${ST(96,54)}<ellipse cx="120" cy="158" rx="92" ry="22" fill="#EBDDC4" stroke="#8A7058" stroke-width="2"/><ellipse cx="120" cy="150" rx="92" ry="22" fill="#F3E8D2" stroke="#8A7058" stroke-width="2"/>
 <path d="M58 132 q-6 -28 26 -40 q30 -11 58 -2 q22 7 24 22 q1 14 -16 22 q-30 14 -64 8 q-24 -4 -28 -10Z" fill="url(#skinG)" stroke="#8A7058" stroke-width="2.4" stroke-linejoin="round"/>
 <path d="M82 120 q24 -14 50 -8 q14 4 16 12 q-26 8 -50 6 q-12 -2 -16 -10Z" fill="url(#shrimpG)" opacity=".55"/>
 <g stroke="#7A6650" stroke-width="1.7" fill="none" stroke-linecap="round"><path d="M70 104 q4 -10 12 -12"/><path d="M84 98 q3 -10 11 -12"/><path d="M98 94 q3 -9 11 -11"/><path d="M112 92 q3 -9 11 -10"/><path d="M126 92 q4 -8 11 -8"/><path d="M139 95 q5 -6 12 -5"/></g>
 <circle cx="116" cy="104" r="40" fill="url(#steamR)"/>${SEAL("虾")}`),
 quoteFull:"一只虾饺,十三道褶",
 desc:"皮要薄到透出里头粉红的虾,褶要数得清,蒸的火候差一线便塌。一笼好虾饺,见的是按板师傅的真功夫。",
 ingredients:["鲜虾","澄面","笋粒","猪油","盐糖少许"],
 method:"澄面以滚水烫熟搓皮,薄擀成圆；鲜虾拌笋,捏出十二三道褶成新月；猛火足汽蒸约五分钟,皮透即起。",
 culture:"虾饺是粤式早茶的「试金石」,行内以褶数与皮的通透论高下。书中借它写按板一脉的手上分寸——克制而精到。"},

{cat:"茶点",name:"嫁女饼(绫酥)",seal:"绫",quote:"绫酥层层,如嫁衣叠褶",
 svg:SV(`${PLATE("#F7EBD6")}<g><ellipse cx="120" cy="118" rx="52" ry="30" fill="url(#skinG)" stroke="#B8893E" stroke-width="2"/>
 <ellipse cx="120" cy="118" rx="40" ry="22" fill="none" stroke="#D8B877" stroke-width="1.3"/><ellipse cx="120" cy="118" rx="28" ry="15" fill="none" stroke="#D8B877" stroke-width="1.3"/><ellipse cx="120" cy="118" rx="15" ry="8" fill="none" stroke="#C8922F" stroke-width="1.3"/>
 <g fill="#C15F3C" opacity=".5">${dot(108,114,1.3)}${dot(132,120,1.3)}${dot(120,110,1.3)}</g></g>${SEAL("绫")}`),
 quoteFull:"绫酥层层,如嫁衣叠褶",
 desc:"旧时女儿出阁的回礼饼,层层起酥,薄如绫罗。一口下去层叠在舌上散开,是甜里藏着的体面与祝祷。",
 ingredients:["面粉","猪油起酥","糖冬瓜","椰丝","糖浆"],
 method:"水油皮包油酥,反复擀叠出数十层；裹糖冬瓜椰丝馅,印模成形,中火烘至金黄起鳞。",
 culture:"嫁女饼是岭南婚俗的礼数,绫酥取「绫罗绸缎」之意。书中以饼写人情往来,甜的是世故,也是温情。"},

{cat:"茶点",name:"唐饼",seal:"唐",quote:"一饼一印,旧时甜",
 svg:SV(`${PLATE("#F2E2C4")}<ellipse cx="120" cy="120" rx="48" ry="28" fill="url(#goldG)" stroke="#A8762A" stroke-width="2"/>
 <g transform="translate(120,118)" fill="none" stroke="#7A5320" stroke-width="1.5" opacity=".75"><circle r="14"/><path d="M0 -14 V14 M-14 0 H14 M-10 -10 L10 10 M10 -10 L-10 10"/></g>${SEAL("唐")}`),
 quoteFull:"一饼一印,旧时甜",
 desc:"传统唐饼皮厚馅实,面上常印吉祥花纹。是茶楼里最家常的一味,朴拙却经得起反复回味。",
 ingredients:["面粉","莲蓉/豆沙","糖","油"],
 method:"和面包馅,压入饼模印出花纹,刷蛋液烘烤至面金底脆。",
 culture:"唐饼是粤港中式饼食的统称,印纹多取「囍」「寿」之意。书中常以一笼唐饼,写市井安稳的日常底色。"},

{cat:"茶点",name:"芋虾",seal:"芋",quote:"金丝结网,酥到化",
 svg:SV(`${PLATE("#F4E6C9")}<g stroke="#C8922F" stroke-width="2" fill="none" stroke-linecap="round">
 <path d="M80 124 q20 -34 60 -28 q24 4 22 24"/><path d="M86 130 q18 -28 54 -24"/><path d="M78 118 q26 -28 64 -18"/><path d="M92 134 q14 -22 44 -22"/><path d="M84 110 q22 -18 50 -10"/><path d="M100 122 q12 -16 34 -16"/></g>
 <path d="M70 128 q50 22 100 0 q-6 16 -50 18 q-44 -2 -50 -18Z" fill="url(#goldG)" opacity=".35"/>${SEAL("芋")}`),
 quoteFull:"金丝结网,酥到化",
 desc:"荔浦芋头刨成细丝,挂浆炸成金黄蓬松的「虾巢」。形似虾却无虾,咬下满口酥香,是手上功夫的炫技。",
 ingredients:["荔浦芋头","澄面","糖","油"],
 method:"芋头刨丝拌粉浆,推入热油定型成蓬松网状,炸至金黄捞起沥油。",
 culture:"芋虾以形取名而非用料,是粤点「以形寓意」的趣味。书中借它写厨人巧思——把寻常芋头做出虚张声势的体面。"},

{cat:"茶点",name:"萝卜糕",seal:"糕",quote:"煎到两面,焦香起",
 svg:SV(`${PLATE("#F3E7CD")}<g>
 <rect x="74" y="106" width="40" height="30" rx="4" fill="url(#riceG)" stroke="#8A7058" stroke-width="2" transform="rotate(-4 94 121)"/>
 <rect x="120" y="110" width="40" height="30" rx="4" fill="url(#riceG)" stroke="#8A7058" stroke-width="2" transform="rotate(5 140 125)"/>
 <g fill="#C8922F" opacity=".5">${dot(86,118,1.6)}${dot(100,126,1.6)}${dot(94,110,1.6)}${dot(134,122,1.6)}${dot(148,130,1.6)}${dot(140,114,1.6)}</g>
 <path d="M74 134 h40 M120 138 h40" stroke="#A8762A" stroke-width="2.5" stroke-linecap="round" opacity=".6"/></g>${SEAL("糕")}`),
 quoteFull:"煎到两面,焦香起",
 desc:"白萝卜刨丝混米浆蒸成糕,切块下镬煎到两面金黄。外脆里糯,夹着腊味与虾米的咸鲜,是岁晚必备。",
 ingredients:["白萝卜","粘米粉","腊味","虾米","葱"],
 method:"萝卜丝炒软拌米浆,加腊味虾米蒸熟成糕；放凉切块,平底镬煎至两面焦香。",

/* ============ 渲染 ============ */
const grid=document.getElementById("grid");
const countEl=document.getElementById("count");
DISHES.forEach((d,i)=>d._i=i);

function render(cat){
  grid.innerHTML="";
  const list=DISHES.filter(d=>cat==="all"||d.cat===cat);
  list.forEach(d=>{
    const el=document.createElement("div");
    el.className="dish";
    el.innerHTML=`<div class="illus">${d.svg}</div>
      <div class="meta"><div class="cat">${d.cat}</div><div class="dn">${d.name}</div>
      <div class="q">${d.quote}</div></div>`;
    el.addEventListener("click",()=>openCard(d._i));
    grid.appendChild(el);
  });
  countEl.textContent=`共 ${list.length} 道`;
}
document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  render(t.dataset.cat);
});

/* ============ Modal ============ */
const overlay=document.getElementById("overlay"),card=document.getElementById("card");
function openCard(i){
  const d=DISHES[i];if(!d)return;
  card.innerHTML=`
    <div class="chero">${d.svg}<button class="close" aria-label="关闭">×</button></div>
    <div class="cbody">
      <div class="ccat">${d.cat}</div>
      <div class="ctitle">${d.name}</div>
      <p class="quote">“${d.quoteFull||d.quote}”</p>
      <div class="sect"><p class="sh">书中描述</p><p>${d.desc}</p></div>
      <div class="sect"><p class="sh">主要食材</p><div class="tags">${d.ingredients.map(x=>`<span>${x}</span>`).join("")}</div></div>
      <div class="sect"><p class="sh">烹制要点</p><p>${d.method}</p></div>
      <div class="sect"><p class="sh">文化背景</p><p>${d.culture}</p></div>
    </div>`;
  card.querySelector(".close").addEventListener("click",closeCard);
  overlay.classList.add("show");
  overlay.scrollTop=0;card.scrollTop=0;
}
function closeCard(){overlay.classList.remove("show");}
overlay.addEventListener("click",e=>{if(e.target===overlay)closeCard();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});

render("all");
</script>

<div class="player" id="player" aria-label="背景音乐播放器">
  <svg class="disc" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#2E241D" stroke="#B8893E" stroke-width="1.5" opacity=".95"/>

  </svg>
  <div class="pinfo">
    <div class="ptitle" id="ptitle">彩云追月</div>
    <div class="psub" id="psub">民乐合奏</div>
  </div>
  <div class="pctrl">
    <button class="pbtn" id="playBtn" type="button" aria-label="播放或暂停">
      <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="pbtn" id="nextBtn" type="button" aria-label="下一首">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l9-7zM16 5h2.5v14H16z"/></svg>
    </button>
  </div>
  <audio id="audio" preload="auto"></audio>
</div>

<script>
/* ── 背景音乐:三首循环 + 跨页面续播 ── */
(function(){
  const tracks=[
    {src:"music/中国广播民族乐团 - 彩云追月(民乐合奏).mp3", title:"彩云追月", sub:"民乐合奏"},
    {src:"music/华夏民族乐团 - 雨打芭蕉 (广东音乐).mp3",   title:"雨打芭蕉", sub:"广东音乐"},
    {src:"music/红线女 - 荔枝颂.mp3",                       title:"荔枝颂",   sub:"红线女 · 粤曲"}
  ];
  const KEY="yanshiji_music";
  const audio=document.getElementById("audio"),
        player=document.getElementById("player"),
        ptitle=document.getElementById("ptitle"),
        psub=document.getElementById("psub"),
        iconPlay=document.getElementById("iconPlay"),
        iconPause=document.getElementById("iconPause");
  let idx=0, seekTo=0, wantPlay=true;
  try{ const s=JSON.parse(localStorage.getItem(KEY)||"null");
       if(s){ idx=s.idx|0; seekTo=s.time||0; wantPlay=s.playing!==false; } }catch(e){}

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify({idx,time:audio.currentTime||0,playing:!audio.paused})); }catch(e){} }

  function load(i,seek){
    idx=(i%tracks.length+tracks.length)%tracks.length;
    audio.src=encodeURI(tracks[idx].src);
    ptitle.textContent=tracks[idx].title;
    psub.textContent=tracks[idx].sub;
    const t=seek||0;
    if(t>0) audio.addEventListener("loadedmetadata",()=>{ try{audio.currentTime=t;}catch(e){} },{once:true});
  }

  audio.addEventListener("ended",()=>{ load(idx+1,0); audio.play().catch(()=>{}); });
  audio.addEventListener("play",()=>{ player.classList.add("playing"); iconPlay.style.display="none"; iconPause.style.display=""; save(); });
  audio.addEventListener("pause",()=>{ player.classList.remove("playing"); iconPlay.style.display=""; iconPause.style.display="none"; save(); });
  let lastSave=0;
  audio.addEventListener("timeupdate",()=>{ const n=Date.now(); if(n-lastSave>1000){ lastSave=n; save(); } });
  window.addEventListener("pagehide",save);

  document.getElementById("playBtn").addEventListener("click",()=>{ if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); });
  document.getElementById("nextBtn").addEventListener("click",()=>{ load(idx+1,0); audio.play().catch(()=>{}); });

  load(idx,seekTo);
  if(wantPlay){
    audio.play().catch(()=>{
      const start=()=>{ audio.play().catch(()=>{}); evs.forEach(e=>window.removeEventListener(e,start)); };
      const evs=["pointerdown","keydown","touchstart","scroll"];
      evs.forEach(e=>window.addEventListener(e,start,{passive:true}));
    });
  }
})();
</script>
